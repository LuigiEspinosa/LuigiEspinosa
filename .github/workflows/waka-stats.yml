name: Waka Readme Stats

on:
  schedule:
    # weekly (Sunday)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          # Output control
          SHOW_TIME: true
          SHOW_TOTAL: true
          SHOW_MASKED_TIME: false

          # Clean up noisy languages
          IGNORED_LANGUAGES: "Text Markdown JSON YAML Git Config"

          # Optional: make output cleaner
          BLOCKS: "░▒▓█"
          TIME_RANGE: "last_7_days"
          LANG_COUNT: 5
